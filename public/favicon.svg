<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- House base -->
  <rect x="20" y="50" width="60" height="40" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <!-- Roof -->
  <path d="M10 50 L50 20 L90 50 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <!-- Door -->
  <rect x="42" y="65" width="16" height="25" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <!-- Door handle -->
  <circle cx="54" cy="77" r="1.5" fill="#fbbf24"/>
  <!-- Windows -->
  <rect x="28" y="58" width="10" height="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="62" y="58" width="10" height="10" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <!-- Window crosses -->
  <line x1="33" y1="58" x2="33" y2="68" stroke="#1e40af" stroke-width="1"/>
  <line x1="28" y1="63" x2="38" y2="63" stroke="#1e40af" stroke-width="1"/>
  <line x1="67" y1="58" x2="67" y2="68" stroke="#1e40af" stroke-width="1"/>
  <line x1="62" y1="63" x2="72" y2="63" stroke="#1e40af" stroke-width="1"/>
</svg>

